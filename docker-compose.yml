# Docker keeps every container's output forever by default. Cap each container at 3 files of 10 MB (30 MB), oldest dropped first.
# Override with LOG_MAX_SIZE and LOG_MAX_FILE in .env.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  syncthing:
    logging: *default-logging
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: syncthing-master
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/var/syncthing/data
      - ./config:/var/syncthing/config
    ports:
      - "${GUI_BIND:-127.0.0.1}:8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"

  restic:
    logging: *default-logging
    image: restic/restic:latest
    container_name: syncthing-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    secrets:
      - restic_password
    environment:
      - RESTIC_REPOSITORY=/repo
      - RESTIC_PASSWORD_FILE=/run/secrets/restic_password
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-3600}
    volumes:
      - ./data:/data:ro
      - ./config:/config:ro
      - ./backups:/repo
      - ./backup/entrypoint.sh:/entrypoint.sh:ro

  # Read-only web UI for browsing snapshots and previewing file versions before restoring.
  # Start on demand: `docker compose --profile browse up -d browser` (then http://127.0.0.1:8080).
  browser:
    profiles: ["browse"]
    logging: *default-logging
    build: ./browser
    container_name: syncthing-backup-browser
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - restic_password
    environment:
      - RESTIC_REPOSITORY=/repo
      - RESTIC_PASSWORD_FILE=/run/secrets/restic_password
      - RESTIC_CACHE_DIR=/tmp/restic-cache
      - ALLOWED_HOSTS=${BROWSER_ALLOWED_HOSTS:-127.0.0.1,localhost}
    volumes:
      - ./backups:/repo:ro
    ports:
      - "${BROWSER_BIND:-127.0.0.1}:8088:8080"

secrets:
  restic_password:
    file: ./secrets/restic_password
